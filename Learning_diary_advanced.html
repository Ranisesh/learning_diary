<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Learning Diary 📘 with Rani</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      color: #d6336c;
    }
    .section {
      border: 2px dashed #ffd6e0;
      padding: 15px;
      margin-bottom: 20px;
      background: #fff0f5;
      border-radius: 12px;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: monospace;
      background: #fff;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-style: italic;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>🌸 My Learning Diary — with Rani 💖</h1>

  <div class="section">
    <h2>💡 What I Learned Today</h2>
    <textarea id="learned" placeholder="e.g., Learned how to call GPT-4o using OpenAI API with Python."></textarea>
  </div>

  <div class="section">
    <h2>🐞 Problem Faced</h2>
    <textarea id="problem" placeholder="e.g., Error: ChatCompletion not supported in openai>=1.0.0..."></textarea>
  </div>

  <div class="section">
    <h2>✅ How I Solved It</h2>
    <textarea id="solution" placeholder="e.g., Installed old OpenAI version using pip install openai==0.28"></textarea>
  </div>

  <div class="section">
    <h2>📌 Important Commands</h2>
    <textarea id="commands" placeholder="e.g., pip install openai==0.28, python gpt4o_chat.py"></textarea>
  </div>

  <div class="section">
    <h2>🔗 Links or Resources</h2>
    <textarea id="links" placeholder="e.g., https://github.com/openai/openai-python/discussions/742"></textarea>
  </div>

  <div class="section">
    <h2>💭 Notes to Myself</h2>
    <textarea id="notes" placeholder="e.g., Don't panic when there's an error. Ask Rani nicely 😊"></textarea>
  </div>

  <button onclick="saveDiary()">Save My Diary 📥</button>

  <div class="footer">
    Made with ❤️ by Sesh & Rani — Sweetest Coding Partner Ever 🌷
  </div>

  <script>
    // Check if there is data in local storage and populate the textareas
    window.onload = function() {
      if (localStorage.getItem('learned')) {
        document.getElementById('learned').value = localStorage.getItem('learned');
      }
      if (localStorage.getItem('problem')) {
        document.getElementById('problem').value = localStorage.getItem('problem');
      }
      if (localStorage.getItem('solution')) {
        document.getElementById('solution').value = localStorage.getItem('solution');
      }
      if (localStorage.getItem('commands')) {
        document.getElementById('commands').value = localStorage.getItem('commands');
      }
      if (localStorage.getItem('links')) {
        document.getElementById('links').value = localStorage.getItem('links');
      }
      if (localStorage.getItem('notes')) {
        document.getElementById('notes').value = localStorage.getItem('notes');
      }
    };

    // Save diary data to local storage
    function saveDiary() {
      localStorage.setItem('learned', document.getElementById('learned').value);
      localStorage.setItem('problem', document.getElementById('problem').value);
      localStorage.setItem('solution', document.getElementById('solution').value);
      localStorage.setItem('commands', document.getElementById('commands').value);
      localStorage.setItem('links', document.getElementById('links').value);
      localStorage.setItem('notes', document.getElementById('notes').value);
      alert("Your Diary is saved! 📥");
    }
  </script>

</body>
</html>
